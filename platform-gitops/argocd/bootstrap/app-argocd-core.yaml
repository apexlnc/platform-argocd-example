apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-argocd-core
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 9.4.17
      helm:
        valueFiles:
          - $values/argocd/core/values.yaml
          # Layer in optional hardening overlays after replacing the placeholders:
          # - $values/argocd/core/values.eks-irsa.example.yaml
          # - $values/argocd/core/values.oidc.example.yaml
          # - $values/argocd/core/values.repo-creds.github-app.example.yaml
    - repoURL: https://github.com/example-org/platform-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
