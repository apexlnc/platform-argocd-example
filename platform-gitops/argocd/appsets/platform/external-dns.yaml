apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-dns
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - clusters:
        selector:
          matchLabels:
            type: standard
            ready: "true"
  template:
    metadata:
      name: external-dns-{{ .nameNormalized }}
      namespace: argocd
      labels:
        layer: platform
        component: external-dns
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      sources:
        - repoURL: https://kubernetes-sigs.github.io/external-dns/
          chart: external-dns
          targetRevision: 1.20.0
          helm:
            valueFiles:
              - $values/argocd/values/platform/external-dns/common.yaml
              - $values/argocd/values/platform/external-dns/env-{{ index .metadata.labels "env" }}.yaml
              - $values/argocd/values/platform/external-dns/type-{{ index .metadata.labels "type" }}.yaml
            valuesObject:
              txtOwnerId: external-dns-{{ .nameNormalized }}
              provider:
                name: aws
              serviceAccount:
                annotations:
                  eks.amazonaws.com/role-arn: 'arn:aws:iam::{{ index .metadata.annotations "account-id" }}:role/external-dns-{{ .name }}'
              global:
                clusterName: '{{ .name }}'
                region: '{{ index .metadata.labels "region" }}'
                environment: '{{ index .metadata.labels "env" }}'
        - repoURL: https://github.com/example-org/platform-gitops.git
          targetRevision: main
          ref: values
      destination:
        server: '{{ .server }}'
        namespace: external-dns
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
