apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-secrets
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - clusters:
        selector:
          matchLabels:
            type: standard
            ready: "true"
  template:
    metadata:
      name: external-secrets-{{ .nameNormalized }}
      namespace: argocd
      labels:
        layer: platform
        component: external-secrets
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      sources:
        - repoURL: https://charts.external-secrets.io
          chart: external-secrets
          targetRevision: 2.2.0
          helm:
            valueFiles:
              - $values/argocd/values/platform/external-secrets/common.yaml
              - $values/argocd/values/platform/external-secrets/env-{{ index .metadata.labels "env" }}.yaml
        - repoURL: https://github.com/example-org/platform-gitops.git
          targetRevision: main
          ref: values
      destination:
        server: '{{ .server }}'
        namespace: external-secrets
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
