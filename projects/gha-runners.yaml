apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: gha-runners
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  description: GitHub Actions runner estate
  sourceRepos:
    - https://github.com/example-org/gha-runners-deployments.git
  destinations:
    - server: "*"
      namespace: gha-runners
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  orphanedResources:
    warn: true
