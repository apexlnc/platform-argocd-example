apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: global-workloads
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  description: Shared workload policy baseline intended for global project inheritance
  sourceRepos:
    - https://github.com/example-org/gha-runners-deployments.git
    - https://github.com/example-org/devops-deployments.git
  destinations:
    - server: "*"
      namespace: "*"
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  orphanedResources:
    warn: true
